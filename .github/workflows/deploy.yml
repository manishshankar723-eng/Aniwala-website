name: Deploy to Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # lets you re-deploy by hand from the Actions tab

  # Content lives in Sanity, so publishing a post changes the site without
  # changing this repo — no push, no build, nothing happens. A webhook on the
  # Sanity project POSTs here when a document is published, which is what makes
  # "Publish" in the Studio actually reach aniwala.com. Setup is in README.md.
  repository_dispatch:
    types: [sanity-publish]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Gate. Runs on pull requests too, so a broken build is caught before
  # it can reach main — where the deploy job below would push it straight
  # into public_html with nothing in between.
  # ------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest

    # Job level, not step level. `astro check` syncs the content collections
    # exactly as `astro build` does, so BOTH need the credentials — putting
    # them on the build step alone made the type check fail while the build
    # would have passed, which reads like a type error and is not one.
    # Anything added later that touches content is covered by default here.
    env:
      SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
      SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must satisfy the `engines` field in package.json. This said 20
          # while package.json asked for >=22.12.0, so CI was building on a
          # runtime the project does not claim to support.
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails in two seconds with a readable message, rather than letting the
      # build run and produce a site with no content. Prints only whether the
      # value is empty, never the value.
      - name: Check the Sanity secrets are actually reaching this job
        run: |
          if [ -z "$SANITY_PROJECT_ID" ]; then
            echo "::error::SANITY_PROJECT_ID is empty in this job."
            echo ""
            echo "The content lives in Sanity, so without this the build produces a"
            echo "site with no blog, no case studies and no job listings."
            echo ""
            echo "Add it under Settings -> Secrets and variables -> Actions, in the"
            echo "REPOSITORY SECRETS section. Environment secrets do not reach a job"
            echo "that declares no 'environment:', which is the usual cause of this."
            exit 1
          fi
          echo "SANITY_PROJECT_ID is present (${#SANITY_PROJECT_ID} characters)."

      # Type and template errors that `astro build` happily ignores: a bad
      # prop type, a missing import, a component called with the wrong shape.
      # This is the check that makes the build gate worth having.
      - name: Type check
        run: npm run check

      # Credentials come from the job-level `env` above. Without them the
      # loaders now abort the build rather than quietly emitting a site with
      # no content — see src/lib/sanity/loader.ts.
      - name: Build
        run: npm run build # outputs ./dist

      # Every one of these has been a real bug on this site. The announcement
      # bar pointed at a page that did not exist for weeks, and og:image
      # pointed at a missing file on all 64 pages, because a static build
      # cheerfully emits both.
      - name: Check for broken internal links and missing assets
        run: node scripts/check-links.mjs

      - name: Keep the build for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ------------------------------------------------------------------
  # Deploy. Only from main, and only if verify passed.
  # ------------------------------------------------------------------
  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the verified build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /public_html/
          # Never delete the second site or Hostinger's own files.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            labs/**
            .well-known/**
