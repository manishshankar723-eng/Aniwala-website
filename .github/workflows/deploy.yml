name: Deploy to Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # lets you re-deploy by hand from the Actions tab

  # Content lives in Sanity, so publishing a post changes the site without
  # changing this repo — no push, no build, nothing happens. A webhook on the
  # Sanity project POSTs here when a document is published, which is what makes
  # "Publish" in the Studio actually reach aniwala.com. Setup is in README.md.
  repository_dispatch:
    types: [sanity-publish]

#
# Two groups, and only one of them may cancel a run that is already going.
#
# This used to be a single fixed group with `cancel-in-progress: true`, which
# put pull requests and production deploys in the SAME queue. Opening a PR
# while a deploy was uploading cancelled the deploy — and the FTP upload is
# not atomic, so killing it half way leaves public_html holding some files
# from the new build and some from the old, with no error raised anywhere and
# nothing in the Actions log that reads like a broken site.
#
# A pull request only ever builds, so superseding one is free: a second push
# to the same branch should cancel the first.
#
# Anything that can DEPLOY — a push to main, a manual re-run, or the Sanity
# publish webhook — shares one group and waits its turn instead. Two documents
# published a few seconds apart is the likeliest way to fire two deploys at
# once, and that is exactly the case where the second must not interrupt the
# first. Queueing costs a couple of minutes; cancelling costs a half-uploaded
# site until somebody happens to notice.
#
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-pr-{0}', github.head_ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repository. It builds, and it uploads over FTP to
# a server GitHub knows nothing about — so GITHUB_TOKEN needs to read the code
# and nothing else.
#
# Without this block the token runs at whatever the repository default is,
# which on older repositories is read AND write on everything: contents,
# packages, deployments, issues. That default is what turns a compromised
# third-party action into a compromised repository, and this job runs three
# actions it does not own.
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Gate. Runs on pull requests too, so a broken build is caught before
  # it can reach main — where the deploy job below would push it straight
  # into public_html with nothing in between.
  # ------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest

    # Job level, not step level. `astro check` syncs the content collections
    # exactly as `astro build` does, so BOTH need the credentials — putting
    # them on the build step alone made the type check fail while the build
    # would have passed, which reads like a type error and is not one.
    # Anything added later that touches content is covered by default here.
    env:
      SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
      SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}

      # Where the booking, application and comment forms post. Both are baked
      # into the built JavaScript, so they have to be present at BUILD time —
      # this job — not at deploy time.
      #
      # The anon key is public by design: it ships inside the bundle and any
      # visitor can read it. It is a secret here only to keep it out of the
      # repo, not because exposure would matter. Row Level Security is what
      # protects the data — see supabase/schema.sql.
      #
      # Absent, the build is still correct: the forms render a "not connected"
      # notice and refuse to submit, rather than losing what somebody typed.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # The Turnstile SITE key — public, and baked into the bundle like the
      # anon key above. Its secret half lives only on the Edge Functions.
      #
      # Absent, the build is still correct: the forms fall back to posting
      # straight to PostgREST, which is what they did before Turnstile
      # existed. That is also the quiet failure worth watching for — set it
      # locally, see the widget, and ship a production build without it, and
      # the live forms silently keep taking the unverified path.
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must satisfy the `engines` field in package.json. This said 20
          # while package.json asked for >=22.12.0, so CI was building on a
          # runtime the project does not claim to support.
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails in two seconds with a readable message, rather than letting the
      # build run and produce a site with no content. Prints only whether the
      # value is empty, never the value.
      - name: Check the Sanity secrets are actually reaching this job
        run: |
          if [ -z "$SANITY_PROJECT_ID" ]; then
            echo "::error::SANITY_PROJECT_ID is empty in this job."
            echo ""
            echo "The content lives in Sanity, so without this the build produces a"
            echo "site with no blog, no case studies and no job listings."
            echo ""
            echo "Add it under Settings -> Secrets and variables -> Actions, in the"
            echo "REPOSITORY SECRETS section. Environment secrets do not reach a job"
            echo "that declares no 'environment:', which is the usual cause of this."
            exit 1
          fi
          echo "SANITY_PROJECT_ID is present (${#SANITY_PROJECT_ID} characters)."

      # A WARNING, not an error, and deliberately so: a site with no Supabase
      # is a valid site — the forms say they are not connected and refuse to
      # submit. Failing the build over it would block a deploy for something
      # that is not broken.
      #
      # It is worth saying out loud all the same. The values live in `.env`
      # locally and as repository secrets here, so the easy mistake is setting
      # them on your own machine, watching the forms work, and shipping a
      # build where they silently do not. Nothing else would tell you.
      - name: Check the Supabase keys reached this job
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Supabase is not configured in CI — the booking, application and comment forms will render a 'not connected' notice and refuse to submit. Add SUPABASE_URL and SUPABASE_ANON_KEY under Settings -> Secrets and variables -> Actions (Repository secrets)."
          else
            echo "Supabase is configured (URL ${#SUPABASE_URL} chars, key ${#SUPABASE_ANON_KEY} chars)."
          fi

      # Type and template errors that `astro build` happily ignores: a bad
      # prop type, a missing import, a component called with the wrong shape.
      # This is the check that makes the build gate worth having.
      - name: Type check
        run: npm run check

      # Credentials come from the job-level `env` above. Without them the
      # loaders now abort the build rather than quietly emitting a site with
      # no content — see src/lib/sanity/loader.ts.
      - name: Build
        run: npm run build # outputs ./dist

      # Every one of these has been a real bug on this site. The announcement
      # bar pointed at a page that did not exist for weeks, and og:image
      # pointed at a missing file on all 64 pages, because a static build
      # cheerfully emits both.
      - name: Check for broken internal links and missing assets
        run: node scripts/check-links.mjs

      - name: Keep the build for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          # WITHOUT THIS, .htaccess NEVER LEAVES THIS JOB.
          #
          # upload-artifact@v4 excludes hidden files by default — a change from
          # v3, and a silent one: the upload succeeds, reports the file count
          # without them, and the deploy job downloads a dist/ that simply has
          # no .htaccess in it.
          #
          # The consequence is a site that serves all 65 pages perfectly with
          # every security header, the whole Content-Security-Policy, the HTTPS
          # redirect and the caching rules missing. Nothing fails. It looks
          # like a successful deploy, which is exactly what happened on the
          # first one that ever succeeded.
          #
          # `dist/` currently has one hidden file and it is load bearing.
          include-hidden-files: true

  # ------------------------------------------------------------------
  # Deploy. Only from main, and only if verify passed.
  # ------------------------------------------------------------------
  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # ------------------------------------------------------------------
    # WHERE THIS DEPLOYS, defined once because three steps need it and a
    # copy that drifts is the failure mode this whole job already has form
    # for. The upload, the .htaccess step and the header check must all
    # agree; if they ever disagree, the site half-deploys and still looks
    # green.
    #
    # STAGING, not the live site, and deliberately. aniwala.com currently
    # serves a WordPress install out of the parent folder. Uploading this
    # build there drops an Astro .htaccess on top of WordPress's own and
    # takes out its permalinks — so the cutover is a decision to make on
    # purpose, not something to arrive at by editing one line.
    #
    # To go live later: change REMOTE_DIR to
    #   domains/aniwala.com/public_html/
    # and SITE_TO_CHECK to https://aniwala.com/ — after backing up
    # public_html and the WordPress database.
    #
    # NO LEADING SLASH, and that changed when this moved from FTP to SSH. The
    # FTP account was chrooted so `/domains/...` meant `/home/u473349005/
    # domains/...`; an SSH session is not, so a leading slash there would mean
    # the real filesystem root and the upload would fail — or, worse, succeed
    # somewhere nobody is serving from. Relative to the login home is the same
    # directory the FTP path meant, spelled the way SSH reads it.
    # ------------------------------------------------------------------
    env:
      REMOTE_DIR: domains/aniwala.com/public_html/staging/
      SITE_TO_CHECK: https://staging.aniwala.com/

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the verified build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # ------------------------------------------------------------------
      # SSH, NOT FTP — and the reason is the one thing FTPS here could not do.
      #
      # This job used to upload over FTPS with certificate validation turned
      # OFF (`security: loose`). Hostinger presents a shared certificate
      # covering *.main-hosting.eu, *.hstgr.io and ~40 hostinger.* domains;
      # nothing on it matches ftp.aniwala.com, and hPanel only ever exposes a
      # bare IP, which a DNS-name certificate cannot match either. So the
      # connection was encrypted but UNAUTHENTICATED: an active on-path
      # attacker presents their own certificate, takes the password, and has
      # write access to public_html — which is the entire site.
      #
      # SSH fixes that properly rather than approximately. The server is
      # identified by its HOST KEY, pinned below. There is no certificate to
      # fail to match and no CA to trust. Three other things improve with it:
      #
      #   - A DEPLOY KEY replaces the account password. It is revocable on its
      #     own, from hPanel -> Advanced -> SSH Access -> SSH keys, without
      #     rotating the password every other tool uses.
      #   - No third-party action holds the credential any more. The FTP action
      #     was handed FTP_USER and FTP_PASS on every single run; `ssh` and
      #     `rsync` are already on the runner and are not somebody's git tag.
      #   - rsync is incremental. The retry-and-wait-two-minutes dance that
      #     used to live here existed because Hostinger throttles bursts of FTP
      #     sessions; one SSH connection moving only what changed does not
      #     provoke it, so both the retry and its sleep are gone.
      #
      # SECRETS THIS NEEDS — Settings -> Secrets and variables -> Actions:
      #   SSH_HOST   89.117.157.182
      #   SSH_USER   u473349005
      #   SSH_PORT   65002
      #   SSH_KEY    the PRIVATE half of the deploy key, the whole file
      #              including the BEGIN and END lines
      #
      # FTP_HOST, FTP_USER and FTP_PASS are no longer read by anything here.
      # Delete them once a deploy has succeeded, and rotate the FTP password:
      # it crossed the internet in the clear on every deploy made before
      # `protocol: ftps` was set.
      # ------------------------------------------------------------------
      - name: Set up the deploy key and pin the server
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_KEY:-}" ] || [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_PORT:-}" ]; then
            echo "::error::SSH_KEY, SSH_HOST or SSH_PORT is empty in this job."
            echo "Add all four SSH_* secrets under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # `tr -d '\r'` IS THE LOAD-BEARING PART, and it cost a red build to
          # find. An OpenSSH private key is line-structured, and OpenSSH
          # refuses one whose lines end CRLF:
          #
          #   Load key "/home/runner/.ssh/id_ed25519": error in libcrypto
          #   Permission denied (publickey,password).
          #
          # That second line is what you see, and it sends you to look at the
          # server — at authorized_keys, at the panel, at the key you pasted
          # there. All of them are fine. The fault is entirely local: the
          # secret itself carries carriage returns.
          #
          # They get in on the way to GitHub, not on the way out. Copying the
          # key on Windows (`clip < keyfile`, or any editor that saves CRLF)
          # rewrites LF to CRLF, and the secret store keeps exactly what it was
          # given. Stripping them here makes the step indifferent to which
          # machine the secret was pasted from, which is the property worth
          # having — the alternative is a re-paste that works until the next
          # person does it from a Windows box.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Prove the key parses HERE, where the message can say so, rather
          # than letting a malformed key surface two steps later as a bare
          # "Permission denied" that looks like a server-side problem.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub 2>/tmp/keyerr; then
            echo "::error::SSH_KEY is not a usable private key: $(cat /tmp/keyerr)"
            echo "Re-copy the WHOLE file, including the BEGIN and END lines and the"
            echo "final newline, into the SSH_KEY secret. It is the file WITHOUT the"
            echo ".pub extension."
            exit 1
          fi

          # Printed so a future auth failure is one glance to diagnose: compare
          # this against the key listed in hPanel -> Advanced -> SSH Access.
          # Expected at the time of writing:
          #   SHA256:4xradlDr6q9YvzUPPEmGQM8IqDaLPMu2apfjXU7vQQY
          echo "  ok      deploy key loaded: $(ssh-keygen -lf ~/.ssh/id_ed25519.pub)"

          # THE PIN, and it is the whole point of moving off FTPS.
          #
          # Hardcoded rather than fetched with `ssh-keyscan` at run time.
          # Scanning the host you are about to trust and then trusting whatever
          # it answered is not verification — it is `StrictHostKeyChecking no`
          # with extra steps, and it would hand an on-path attacker the same
          # opening `security: loose` did.
          #
          # Read off the server on 2026-09-08. Checked in on purpose: if the
          # server's identity ever changes this fails the deploy loudly, and
          # the fix arrives as a reviewable diff. DO NOT "fix" a mismatch by
          # re-scanning — find out why the identity changed first.
          printf '[%s]:%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICGvRICAr4tsrZAGDXkZBtPewof3+DgfOPCfqxkExJqh\n' \
            "$SSH_HOST" "$SSH_PORT" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "Deploy key installed and host key pinned."

      # Fails in seconds with a readable message rather than half way through
      # an upload. Checks the three things that can each break a deploy on
      # their own: the build carries .htaccess, the key is accepted and rsync
      # exists on the server, and the target directory is really there — a
      # typo'd path would otherwise be created silently and serve nothing.
      - name: Preflight — reach the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail

          if [ ! -f dist/.htaccess ]; then
            echo "::error::dist/.htaccess is missing from the build."
            echo "Without it the site serves every page with no CSP, no HSTS and no"
            echo "HTTPS redirect, and nothing else in this job would notice."
            exit 1
          fi
          echo "  ok      dist/.htaccess is present ($(wc -c < dist/.htaccess) bytes)"

          # The WordPress guard is not paranoia — this file's own comments
          # anticipate someone changing REMOTE_DIR to the parent folder at
          # cutover, and the upload runs `rsync --delete`. Pointed one
          # directory too high, that deletes wp-admin, wp-includes and every
          # upload in wp-content, because none of them are in dist/. A live
          # WordPress install and a --delete sync must never share a path, so
          # the deploy refuses rather than discovering it afterwards.
          ssh -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=20 \
              "$SSH_USER@$SSH_HOST" \
              "command -v rsync >/dev/null || { echo '::error::rsync is not on the server.'; exit 1; }; \
               test -d '$REMOTE_DIR' || { echo '::error::$REMOTE_DIR does not exist on the server.'; exit 1; }; \
               if [ -e '$REMOTE_DIR/wp-config.php' ] || [ -d '$REMOTE_DIR/wp-content' ]; then \
                 echo '::error::$REMOTE_DIR looks like a WordPress install.'; \
                 echo 'The upload runs rsync --delete and would destroy it. Check REMOTE_DIR.'; \
                 exit 1; \
               fi; \
               echo '  ok      rsync present'; \
               echo '  ok      $REMOTE_DIR exists and is not a WordPress root'"

      - name: Upload the site
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail

          # -rlptz, NOT -a. `-a` implies -o -g -D, which ask to preserve owner,
          # group and device files; shared hosting grants none of the three and
          # the transfer fails on permissions it was never going to get.
          #
          # A trailing slash on `dist/` means "the CONTENTS of dist", which is
          # what puts .htaccess at the document root rather than inside a
          # `dist/` subfolder. rsync carries dotfiles without being asked, so
          # the separate .htaccess upload the FTP path needed is gone — and
          # with it the `curl --insecure` that used to send the password.
          #
          # NEVER DELETE THE SECOND SITE OR HOSTINGER'S OWN FILES. An excluded
          # path is skipped for transfer AND protected from --delete, which is
          # exactly the behaviour wanted. (`--delete-excluded` would undo that;
          # do not add it.)
          #
          # `.well-known/` is the one that matters most: it is where the ACME
          # client writes the challenge files that renew the TLS certificate.
          # Delete it and renewal fails — against the two-year
          # Strict-Transport-Security in .htaccess, that is an outage no
          # visitor can click past, arriving up to ninety days later.
          rsync -rlptz --delete --human-readable --stats \
                --exclude='.git*' \
                --exclude='node_modules/' \
                --exclude='labs/' \
                --exclude='.well-known/' \
                -e "ssh -p $SSH_PORT -o BatchMode=yes -o ConnectTimeout=30" \
                dist/ "$SSH_USER@$SSH_HOST:$REMOTE_DIR"

      # A deploy that serves pages without .htaccess looks completely healthy,
      # so the run asserts the headers are really there rather than trusting
      # that the upload above did what it said.
      - name: Verify the security headers are actually live
        run: |
          URL="${SITE_TO_CHECK}"
          echo "Checking $URL"
          HEADERS=$(curl -sSI --max-time 30 "$URL" | tr -d '\r')
          fail=0
          for h in "strict-transport-security" "x-frame-options" "x-content-type-options" "content-security-policy"; do
            if echo "$HEADERS" | grep -qi "^$h:"; then
              echo "  ok      $h"
            else
              echo "::error::Missing header: $h — .htaccess did not take effect."
              fail=1
            fi
          done
          if echo "$HEADERS" | grep -qi "^content-security-policy:.*default-src"; then
            echo "  ok      CSP is ours (has default-src), not the host's default"
          else
            echo "::error::CSP present but not ours — the host default is showing through."
            fail=1
          fi
          exit $fail
